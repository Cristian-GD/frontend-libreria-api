<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Librería</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container navbar-content">
      <h1>📚 Catálogo de Librería</h1>
      <span id="apiStatus" class="api-badge">Conectando...</span>
    </div>
  </header>

  <main class="container layout">
    <!-- Panel izquierdo: Formulario para Crear y Editar -->
    <aside class="sidebar">
      <div class="card">
        <div class="card-header">
          <h2 id="formTitle">Registrar Nuevo Libro</h2>
          <button type="button" id="cancelEditBtn" class="btn-secondary hidden">
            Cancelar edición
          </button>
        </div>

        <form id="libroForm">
          <input type="hidden" id="libroIdInput" />

          <div class="form-group">
            <label for="tituloInput">Título</label>
            <input
              type="text"
              id="tituloInput"
              placeholder="Ej. Cien años de soledad"
              required
            />
          </div>

          <div class="form-group">
            <label for="autorInput">Autor</label>
            <input
              type="text"
              id="autorInput"
              placeholder="Ej. Gabriel García Márquez"
              required
            />
          </div>

          <div class="form-group">
            <label for="generoInput">Género</label>
            <select id="generoInput" required>
              <option value="" disabled selected>Selecciona un género</option>
              <option value="Novela">Novela</option>
              <option value="Ciencia Ficción">Ciencia Ficción</option>
              <option value="Fantasía">Fantasía</option>
              <option value="Historia">Historia</option>
              <option value="Tecnología">Tecnología</option>
              <option value="Ensayo">Ensayo</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="anioInput">Año (1450 - 2026)</label>
              <input
                type="number"
                id="anioInput"
                min="1450"
                max="2026"
                placeholder="1967"
                required
              />
            </div>

            <div class="form-group">
              <label for="paginasInput">Páginas</label>
              <input
                type="number"
                id="paginasInput"
                min="1"
                placeholder="471"
                required
              />
            </div>
          </div>

          <div class="form-group checkbox-group">
            <input type="checkbox" id="disponibleInput" checked />
            <label for="disponibleInput">Disponible para préstamo</label>
          </div>

          <button type="submit" id="submitBtn" class="btn-primary btn-full">
            + Guardar Libro
          </button>
        </form>
      </div>
    </aside>

    <!-- Panel derecho: Filtros y cuadrícula de libros -->
    <section class="content">
      <div class="toolbar">
        <div class="search-controls">
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar por título o autor..."
          />
          <select id="disponibilidadFilter">
            <option value="">Todos los estados</option>
            <option value="true">Solo disponibles</option>
            <option value="false">Solo prestados</option>
          </select>
        </div>

        <div class="filter-tabs">
          <button type="button" class="filter-btn active" data-genero="">Todos</button>
          <button type="button" class="filter-btn" data-genero="Novela">Novela</button>
          <button type="button" class="filter-btn" data-genero="Ciencia Ficción">Ciencia Ficción</button>
          <button type="button" class="filter-btn" data-genero="Fantasía">Fantasía</button>
          <button type="button" class="filter-btn" data-genero="Historia">Historia</button>
          <button type="button" class="filter-btn" data-genero="Tecnología">Tecnología</button>
          <button type="button" class="filter-btn" data-genero="Ensayo">Ensayo</button>
        </div>
      </div>

      <div id="librosGrid" class="libros-grid">
        <p class="empty-msg">Cargando catálogo...</p>
      </div>
    </section>
  </main>

  <!-- Modal para Consultar Detalle (GET /api/v1/libro/:id) -->
  <div id="detailModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Detalle del Libro</h3>
        <button type="button" id="closeModalBtn" class="btn-icon">✕</button>
      </div>
      <div id="detailBody" class="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
